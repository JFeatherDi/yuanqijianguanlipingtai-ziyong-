<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IOTAT · 元器件管理后台</title>
<style>
:root {
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --primary-light: #eef2ff;
  --success: #10b981;
  --success-light: #d1fae5;
  --warning: #f59e0b;
  --warning-light: #fef3c7;
  --danger: #ef4444;
  --danger-light: #fee2e2;
  --bg: #f9fafb;
  --surface: #ffffff;
  --border: #e5e7eb;
  --border-light: #f3f4f6;
  --text-primary: #111827;
  --text-secondary: #4b5563;
  --text-muted: #9ca3af;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --radius: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
}

/* ========== Header ========== */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 600;
  font-size: 16px;
}

.logo-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 18px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--bg);
  border-radius: 20px;
  font-size: 13px;
}

.avatar {
  width: 28px;
  height: 28px;
  background: var(--primary);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
}

.btn-logout {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 6px;
  border-radius: 6px;
  transition: all 0.15s;
}

.btn-logout:hover {
  background: var(--danger-light);
  color: var(--danger);
}

/* ========== Main Container ========== */
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
}

/* ========== Page Header ========== */
.page-header {
  margin-bottom: 24px;
}

.page-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.page-desc {
  color: var(--text-muted);
  font-size: 14px;
}

/* ========== Dashboard Cards ========== */
.dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s;
}

.card:hover {
  box-shadow: var(--shadow-md);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.card-icon {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.card-icon.blue { background: #dbeafe; color: #3b82f6; }
.card-icon.green { background: var(--success-light); color: var(--success); }
.card-icon.orange { background: var(--warning-light); color: var(--warning); }
.card-icon.red { background: var(--danger-light); color: var(--danger); }

.card-label {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
}

.card-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.2;
}

.card-trend {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.card-trend.up { color: var(--success); }
.card-trend.down { color: var(--danger); }

/* ========== Toolbar ========== */
.toolbar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.search-box {
  flex: 1;
  min-width: 200px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 8px 12px 8px 36px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  transition: all 0.15s;
}

.search-box input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

.search-box::before {
  content: "🔍";
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  opacity: 0.5;
}

.btn {
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.btn:hover {
  background: var(--bg);
  border-color: var(--text-muted);
}

.btn-primary {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

.btn-primary:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}

.btn-success {
  background: var(--success);
  border-color: var(--success);
  color: white;
}

.btn-success:hover {
  background: #059669;
}

.btn-warning {
  background: var(--warning);
  border-color: var(--warning);
  color: white;
}

.btn-warning:hover {
  background: #d97706;
}

.btn-danger {
  background: var(--danger);
  border-color: var(--danger);
  color: white;
}

.btn-danger:hover {
  background: #dc2626;
}

.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text-muted);
}

.btn-ghost:hover {
  background: var(--bg);
  color: var(--text-primary);
}

.btn-sm {
  padding: 4px 10px;
  font-size: 13px;
}

.btn-icon {
  padding: 6px;
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* ========== Table ========== */
.table-wrapper {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.table-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.table-title {
  font-size: 16px;
  font-weight: 600;
}

.table-count {
  font-size: 13px;
  color: var(--text-muted);
  background: var(--bg);
  padding: 4px 10px;
  border-radius: 12px;
}

.table-scroll {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

th {
  padding: 12px 16px;
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

tbody tr {
  border-bottom: 1px solid var(--border-light);
  transition: background 0.15s;
}

tbody tr:hover {
  background: #f9fafb;
}

tbody tr:last-child {
  border-bottom: none;
}

td {
  padding: 12px 16px;
  font-size: 14px;
  color: var(--text-secondary);
}

td.name {
  font-weight: 600;
  color: var(--text-primary);
}

td.num {
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
}

.tag-blue { background: #dbeafe; color: #1e40af; }
.tag-gray { background: var(--bg); color: var(--text-muted); }

.stock-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
}

.stock-badge::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.stock-ok {
  background: var(--success-light);
  color: #047857;
}

.stock-ok::before {
  background: var(--success);
}

.stock-low {
  background: var(--danger-light);
  color: #b91c1c;
}

.stock-low::before {
  background: var(--danger);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.actions {
  display: flex;
  gap: 4px;
  justify-content: flex-end;
}

.action-btn {
  padding: 6px;
  border-radius: 4px;
  border: none;
  background: transparent;
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.15s;
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.action-btn:hover {
  background: var(--bg);
}

.action-btn.in:hover { color: var(--success); background: var(--success-light); }
.action-btn.out:hover { color: var(--warning); background: var(--warning-light); }
.action-btn.edit:hover { color: var(--primary); background: var(--primary-light); }
.action-btn.del:hover { color: var(--danger); background: var(--danger-light); }

/* ========== Empty State ========== */
.empty-state {
  text-align: center;
  padding: 60px 20px;
}

.empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.3;
}

.empty-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.empty-desc {
  color: var(--text-muted);
  margin-bottom: 24px;
}

/* ========== Modal ========== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px;
  overflow-y: auto;
}

.modal-overlay.show {
  display: flex;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: var(--surface);
  border-radius: var(--radius);
  width: 100%;
  max-width: 480px;
  box-shadow: var(--shadow-md);
  animation: slideUp 0.25s ease;
}

.modal.wide {
  max-width: 720px;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 18px;
  font-weight: 600;
}

.modal-close {
  background: none;
  border: none;
  font-size: 24px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  line-height: 1;
  border-radius: 4px;
  transition: all 0.15s;
}

.modal-close:hover {
  background: var(--bg);
  color: var(--text-primary);
}

.modal-body {
  padding: 24px;
}

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--bg);
}

/* ========== Form ========== */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.form-label .req {
  color: var(--danger);
  margin-left: 2px;
}

.form-input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  transition: all 0.15s;
}

.form-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

.form-input:disabled {
  background: var(--bg);
  color: var(--text-muted);
  cursor: not-allowed;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-hint {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ========== Info Box ========== */
.info-box {
  background: var(--primary-light);
  border: 1px solid #c7d2fe;
  border-radius: 6px;
  padding: 12px 16px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.info-box-icon {
  font-size: 20px;
}

.info-box-content {
  flex: 1;
}

.info-box-label {
  font-size: 12px;
  color: #4338ca;
  font-weight: 500;
}

.info-box-value {
  font-size: 16px;
  font-weight: 600;
  color: #1e1b4b;
}

/* ========== Toast ========== */
.toast-container {
  position: fixed;
  top: 72px;
  right: 24px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 360px;
}

.toast {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideInRight 0.3s ease;
  font-size: 14px;
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(100px); }
  to { opacity: 1; transform: translateX(0); }
}

.toast.removing {
  animation: slideOutRight 0.2s ease forwards;
}

@keyframes slideOutRight {
  to { opacity: 0; transform: translateX(100px); }
}

.toast-icon {
  font-size: 18px;
  flex-shrink: 0;
}

.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.warning { border-left: 3px solid var(--warning); }
.toast.info { border-left: 3px solid var(--primary); }

.toast.success .toast-icon { color: var(--success); }
.toast.error .toast-icon { color: var(--danger); }
.toast.warning .toast-icon { color: var(--warning); }
.toast.info .toast-icon { color: var(--primary); }

/* ========== Loading ========== */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(4px);
  z-index: 3000;
  display: none;
  align-items: center;
  justify-content: center;
}

.loading-overlay.show {
  display: flex;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ========== Transaction Table ========== */
.txn-table {
  font-size: 13px;
}

.txn-table th,
.txn-table td {
  padding: 10px 12px;
}

.txn-type {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
}

.txn-in { background: var(--success-light); color: #047857; }
.txn-out { background: var(--warning-light); color: #92400e; }
.txn-init { background: var(--primary-light); color: #3730a3; }
.txn-import { background: #f3f4f6; color: #4b5563; }

.txn-delta-pos { color: var(--success); font-weight: 600; }
.txn-delta-neg { color: var(--warning); font-weight: 600; }

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .container { padding: 16px; }
  .dashboard { grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { padding: 16px; }
  .card-value { font-size: 24px; }
  .toolbar { flex-direction: column; align-items: stretch; }
  .search-box { min-width: 0; }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .form-row { grid-template-columns: 1fr; }
  .modal { margin: 0; border-radius: 0; min-height: 100vh; }
}

@media (max-width: 480px) {
  .dashboard { grid-template-columns: 1fr; }
  .header { padding: 0 16px; }
  .user-info span { display: none; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="logo">
    <div class="logo-icon">📦</div>
    <span>IOTAT 元器件管理</span>
  </div>
  <div class="header-right">
    <div class="user-info">
      <div class="avatar" id="avatar">U</div>
      <span id="userLabel">用户</span>
    </div>
    <button class="btn-logout" onclick="logout()" title="退出登录">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
      </svg>
    </button>
  </div>
</header>

<!-- Main -->
<div class="container">
  
  <!-- Page Header -->
  <div class="page-header">
    <h1 class="page-title">元器件库存管理</h1>
    <p class="page-desc">管理实验室所有电子元器件的入库、出库和库存查询</p>
  </div>

  <!-- Dashboard -->
  <div class="dashboard">
    <div class="card">
      <div class="card-header">
        <div class="card-icon blue">📋</div>
        <span class="card-label">器件总数</span>
      </div>
      <div class="card-value" id="statTotal">0</div>
      <div class="card-trend">
        <span>所有元器件种类</span>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-icon green">📦</div>
        <span class="card-label">总库存量</span>
      </div>
      <div class="card-value" id="statStock">0</div>
      <div class="card-trend up">
        <span>所有器件库存总和</span>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-icon orange">⚠️</div>
        <span class="card-label">低库存预警</span>
      </div>
      <div class="card-value" id="statLow">0</div>
      <div class="card-trend down">
        <span>低于预警值的器件</span>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-icon red">📊</div>
        <span class="card-label">近期操作</span>
      </div>
      <div class="card-value" id="statRecent">0</div>
      <div class="card-trend">
        <span>最近24小时操作数</span>
      </div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="search" placeholder="搜索器件名称、分类、规格..." oninput="handleSearch()">
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="openAddModal()">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        新增器件
      </button>
      <button class="btn btn-success" onclick="document.getElementById('fileInput').click()">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
        </svg>
        导入
      </button>
      <input type="file" id="fileInput" accept=".csv,.xlsx,.xlsm" style="display:none" onchange="handleImport(this)">
      <button class="btn" onclick="downloadTemplate()">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
        模板
      </button>
      <button class="btn" onclick="exportCsv()">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        导出
      </button>
      <button class="btn" onclick="openTxnModal()">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
        </svg>
        操作记录
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <div class="table-header">
      <span class="table-title">器件列表</span>
      <span class="table-count" id="tableCount">0 项</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>分类</th>
            <th>名称</th>
            <th>规格/型号</th>
            <th>单位</th>
            <th>位置</th>
            <th style="text-align:right">库存</th>
            <th style="text-align:right">预警值</th>
            <th>备注</th>
            <th style="text-align:right">操作</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr>
            <td colspan="9">
              <div class="empty-state">
                <div class="empty-icon">📦</div>
                <div class="empty-title">暂无器件数据</div>
                <div class="empty-desc">点击"新增器件"添加第一个器件，或使用"导入"批量导入</div>
                <button class="btn btn-primary" onclick="openAddModal()">新增器件</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modalAdd">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalAddTitle">新增器件</span>
      <button class="modal-close" onclick="closeModal('modalAdd')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label class="form-label">器件名称 <span class="req">*</span></label>
        <input type="text" class="form-input" id="f_name" placeholder="例如：电阻 10K">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">分类</label>
          <input type="text" class="form-input" id="f_category" placeholder="例如：电阻" list="catList">
          <datalist id="catList"></datalist>
        </div>
        <div class="form-group">
          <label class="form-label">规格/型号</label>
          <input type="text" class="form-input" id="f_spec" placeholder="例如：0805">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">单位</label>
          <input type="text" class="form-input" id="f_unit" placeholder="个" list="unitList">
          <datalist id="unitList">
            <option value="个">
            <option value="只">
            <option value="片">
            <option value="卷">
            <option value="包">
            <option value="盒">
          </datalist>
        </div>
        <div class="form-group">
          <label class="form-label">存放位置</label>
          <input type="text" class="form-input" id="f_location" placeholder="例如：A柜-1层">
        </div>
      </div>
      <div class="form-row" id="stockFields">
        <div class="form-group">
          <label class="form-label">初始库存</label>
          <input type="number" class="form-input" id="f_stock" value="0" min="0" step="any">
        </div>
        <div class="form-group">
          <label class="form-label">预警值</label>
          <input type="number" class="form-input" id="f_threshold" value="0" min="0" step="any">
          <div class="form-hint">库存低于此值时显示预警</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">备注</label>
        <input type="text" class="form-input" id="f_remark" placeholder="可选备注信息">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modalAdd')">取消</button>
      <button class="btn btn-primary" onclick="submitAdd()">保存</button>
    </div>
  </div>
</div>

<!-- In Stock Modal -->
<div class="modal-overlay" id="modalIn">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">入库</span>
      <button class="modal-close" onclick="closeModal('modalIn')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="info-box">
        <span class="info-box-icon">📦</span>
        <div class="info-box-content">
          <div class="info-box-label">当前库存</div>
          <div class="info-box-value" id="in_current">-</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">入库数量 <span class="req">*</span></label>
        <input type="number" class="form-input" id="in_qty" min="0" step="any" placeholder="输入入库数量">
      </div>
      <div class="form-group">
        <label class="form-label">备注</label>
        <input type="text" class="form-input" id="in_remark" placeholder="可选">

    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modalIn')">取消</button>
      <button class="btn btn-success" onclick="submitStock('in')">确认入库</button>

</div>

<!-- Out Stock Modal -->
<div class="modal-overlay" id="modalOut">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">出库</span>
      <button class="modal-close" onclick="closeModal('modalOut')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="info-box" style="background: var(--warning-light); border-color: #fcd34d;">
        <span class="info-box-icon">⚠️</span>
        <div class="info-box-content">
          <div class="info-box-label" style="color: #92400e;">当前库存</div>
          <div class="info-box-value" id="out_current" style="color: #78350f;">-</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">出库数量 <span class="req">*</span></label>
        <input type="number" class="form-input" id="out_qty" min="0" step="any" placeholder="输入出库数量">
      </div>
      <div class="form-group">
        <label class="form-label">备注</label>
        <input type="text" class="form-input" id="out_remark" placeholder="可选">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modalOut')">取消</button>
      <button class="btn btn-warning" onclick="submitStock('out')">确认出库</button>
    </div>
  </div>
</div>

<!-- Transaction Modal -->
<div class="modal-overlay" id="modalTxn">
  <div class="modal wide">
    <div class="modal-header">
      <span class="modal-title">操作记录</span>
      <button class="modal-close" onclick="closeModal('modalTxn')">&times;</button>
    </div>
    <div class="modal-body" style="padding: 0;">
      <div style="max-height: 500px; overflow-y: auto;">
        <table class="txn-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>器件</th>
              <th>规格</th>
              <th>类型</th>
              <th style="text-align:right">数量</th>
              <th>操作人</th>
              <th>备注</th>
            </tr>
          </thead>
          <tbody id="txnBody">
            <tr><td colspan="7" style="text-align:center; padding: 40px; color: var(--text-muted);">暂无操作记录</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modalTxn')">关闭</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
</div>

<script>
let cache = [];
let searchTimer = null;
let editingId = null;
let currentStockItem = null;

// ========== API ==========
async function api(url, opts = {}) {
  const res = await fetch(url, opts);
  if (res.status === 401) {
    location.href = '/';
    throw new Error('未登录');
  }
  return res.json();
}

// ========== Toast ==========
function showToast(msg, type = 'info') {
  const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('removing');
    setTimeout(() => toast.remove(), 200);
  }, 3000);
}

// ========== Loading ==========
function showLoading(show) {
  document.getElementById('loading').classList.toggle('show', show);
}

// ========== Modal ==========
function openModal(id) {
  document.getElementById(id).classList.add('show');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('show');
  });
});

// Close modal on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
  }
});

// ========== User ==========
async function loadUser() {
  const data = await api('/me');
  if (data.ok) {
    document.getElementById('userLabel').textContent = data.user;
    document.getElementById('avatar').textContent = data.user.charAt(0).toUpperCase();
  }
}

function logout() {
  api('/logout', { method: 'POST' }).then(() => location.href = '/');
}

// ========== Data Loading ==========
async function loadData() {
  showLoading(true);
  try {
    const data = await api('/api/components');
    if (data.ok) {
      cache = data.data;
      renderTable();
      updateStats();
    }
  } finally {
    showLoading(false);
  }
}

function updateStats() {
  const total = cache.length;
  const totalStock = cache.reduce((sum, c) => sum + (parseFloat(c.stock) || 0), 0);
  const lowCount = cache.filter(c => parseFloat(c.stock) <= parseFloat(c.threshold)).length;
  
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statStock').textContent = totalStock.toFixed(totalStock % 1 === 0 ? 0 : 2);
  document.getElementById('statLow').textContent = lowCount;
  document.getElementById('tableCount').textContent = `${total} 项`;
  
  // Load recent transactions count (last 24h)
  api('/api/transactions?limit=100').then(data => {
    if (data.ok) {
      const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
      const recent = data.data.filter(t => t.created_at >= yesterday).length;
      document.getElementById('statRecent').textContent = recent;
    }
  });
}

// ========== Table Rendering ==========
function renderTable(filter = '') {
  const tbody = document.getElementById('tbody');
  const filtered = filter 
    ? cache.filter(c => 
        c.name.toLowerCase().includes(filter) ||
        (c.category || '').toLowerCase().includes(filter) ||
        (c.spec || '').toLowerCase().includes(filter) ||
        (c.location || '').toLowerCase().includes(filter)
      )
    : cache;

  if (filtered.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="9">
          <div class="empty-state">
            <div class="empty-icon">${filter ? '🔍' : '📦'}</div>
            <div class="empty-title">${filter ? '未找到匹配的器件' : '暂无器件数据'}</div>
            <div class="empty-desc">${filter ? '请尝试其他搜索关键词' : '点击"新增器件"添加第一个器件，或使用"导入"批量导入'}</div>
            ${!filter ? '<button class="btn btn-primary" onclick="openAddModal()">新增器件</button>' : ''}
          </div>
        </td>
      </tr>
    `;
    document.getElementById('tableCount').textContent = `${filtered.length} / ${cache.length} 项`;
    return;
  }

  tbody.innerHTML = filtered.map(c => {
    const stock = parseFloat(c.stock) || 0;
    const threshold = parseFloat(c.threshold) || 0;
    const isLow = stock <= threshold && threshold > 0;
    const stockClass = isLow ? 'stock-low' : 'stock-ok';
    
    return `
      <tr>
        <td><span class="tag tag-blue">${c.category || '-'}</span></td>
        <td class="name">${c.name}</td>
        <td>${c.spec || '-'}</td>
        <td>${c.unit || '个'}</td>
        <td>${c.location || '-'}</td>
        <td class="num"><span class="stock-badge ${stockClass}">${stock}</span></td>
        <td class="num">${threshold}</td>
        <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${c.remark || ''}">${c.remark || '-'}</td>
        <td>
          <div class="actions">
            <button class="action-btn in" title="入库" onclick="openStockModal('in', ${c.id})">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
              </svg>
            </button>
            <button class="action-btn out" title="出库" onclick="openStockModal('out', ${c.id})">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
              </svg>
            </button>
            <button class="action-btn edit" title="编辑" onclick="openEditModal(${c.id})">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
              </svg>
            </button>
            <button class="action-btn del" title="删除" onclick="deleteItem(${c.id})">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
            </button>
          </div>
        </td>
      </tr>
    `;
  }).join('');

  document.getElementById('tableCount').textContent = filter ? `${filtered.length} / ${cache.length} 项` : `${filtered.length} 项`;
}

// ========== Search ==========
function handleSearch() {
  clearTimeout(searchTimer);
  const query = document.getElementById('search').value.trim().toLowerCase();
  searchTimer = setTimeout(() => renderTable(query), 200);
}

// ========== Add/Edit ==========
function openAddModal() {
  editingId = null;
  document.getElementById('modalAddTitle').textContent = '新增器件';
  document.getElementById('editId').value = '';
  document.getElementById('f_name').value = '';
  document.getElementById('f_category').value = '';
  document.getElementById('f_spec').value = '';
  document.getElementById('f_unit').value = '';
  document.getElementById('f_location').value = '';
  document.getElementById('f_stock').value = '0';
  document.getElementById('f_threshold').value = '0';
  document.getElementById('f_remark').value = '';
  document.getElementById('stockFields').style.display = '';
  openModal('modalAdd');
  document.getElementById('f_name').focus();
}

function openEditModal(id) {
  const item = cache.find(c => c.id === id);
  if (!item) return;
  
  editingId = id;
  document.getElementById('modalAddTitle').textContent = '编辑器件';
  document.getElementById('editId').value = id;
  document.getElementById('f_name').value = item.name;
  document.getElementById('f_category').value = item.category || '';
  document.getElementById('f_spec').value = item.spec || '';
  document.getElementById('f_unit').value = item.unit || '';
  document.getElementById('f_location').value = item.location || '';
  document.getElementById('f_threshold').value = item.threshold || 0;
  document.getElementById('f_remark').value = item.remark || '';
  document.getElementById('stockFields').style.display = 'none';
  openModal('modalAdd');
  document.getElementById('f_name').focus();
}

async function submitAdd() {
  const name = document.getElementById('f_name').value.trim();
  if (!name) {
    showToast('请输入器件名称', 'warning');
    document.getElementById('f_name').focus();
    return;
  }

  const body = {
    name,
    category: document.getElementById('f_category').value.trim(),
    spec: document.getElementById('f_spec').value.trim(),
    unit: document.getElementById('f_unit').value.trim() || '个',
    location: document.getElementById('f_location').value.trim(),
    threshold: parseFloat(document.getElementById('f_threshold').value) || 0,
    remark: document.getElementById('f_remark').value.trim()
  };

  showLoading(true);
  try {
    let data;
    if (editingId) {
      data = await api(`/api/components/${editingId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    } else {
      body.stock = parseFloat(document.getElementById('f_stock').value) || 0;
      data = await api('/api/components', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }
    
    if (data.ok) {
      showToast(editingId ? '器件已更新' : '器件已添加', 'success');
      closeModal('modalAdd');
      await loadData();
    } else {
      showToast(data.msg || '操作失败', 'error');
    }
  } finally {
    showLoading(false);
  }
}

// ========== Stock In/Out ==========
function openStockModal(type, id) {
  const item = cache.find(c => c.id === id);
  if (!item) return;
  
  currentStockItem = { type, id, stock: parseFloat(item.stock) || 0, unit: item.unit || '个', name: item.name };
  
  if (type === 'in') {
    document.getElementById('in_current').textContent = `${currentStockItem.stock} ${currentStockItem.unit}`;
    document.getElementById('in_qty').value = '';
    document.getElementById('in_remark').value = '';
    openModal('modalIn');
    document.getElementById('in_qty').focus();
  } else {
    document.getElementById('out_current').textContent = `${currentStockItem.stock} ${currentStockItem.unit}`;
    document.getElementById('out_qty').value = '';
    document.getElementById('out_remark').value = '';
    openModal('modalOut');
    document.getElementById('out_qty').focus();
  }
}

async function submitStock(type) {
  if (!currentStockItem) return;
  
  const qtyInput = document.getElementById(type === 'in' ? 'in_qty' : 'out_qty');
  const remarkInput = document.getElementById(type === 'in' ? 'in_remark' : 'out_remark');
  const qty = parseFloat(qtyInput.value);
  
  if (!qty || qty <= 0) {
    showToast('请输入有效的数量', 'warning');
    qtyInput.focus();
    return;
  }

  showLoading(true);
  try {
    const data = await api(`/api/stock/${type}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: currentStockItem.id,
        qty,
        remark: remarkInput.value.trim()
      })
    });
    
    if (data.ok) {
      showToast(`${type === 'in' ? '入库' : '出库'}成功`, 'success');
      closeModal(type === 'in' ? 'modalIn' : 'modalOut');
      await loadData();
    } else {
      showToast(data.msg || '操作失败', 'error');
    }
  } finally {
    showLoading(false);
  }
}

// ========== Delete ==========
async function deleteItem(id) {
  const item = cache.find(c => c.id === id);
  if (!item) return;
  
  if (!confirm(`确定要删除器件 "${item.name}" 吗？此操作不可恢复。`)) return;
  
  showLoading(true);
  try {
    const data = await api(`/api/components/${id}`, { method: 'DELETE' });
    if (data.ok) {
      showToast('器件已删除', 'success');
      await loadData();
    } else {
      showToast(data.msg || '删除失败', 'error');
    }
  } finally {
    showLoading(false);
  }
}

// ========== Import/Export ==========
async function handleImport(input) {
  const file = input.files[0];
  if (!file) return;
  
  const formData = new FormData();
  formData.append('file', file);
  
  showLoading(true);
  try {
    const data = await api('/api/import', {
      method: 'POST',
      body: formData
    });
    
    if (data.ok) {
      showToast(`导入成功：${data.imported} 条记录`, 'success');
      await loadData();
    } else {
      showToast(data.msg || '导入失败', 'error');
    }
  } finally {
    showLoading(false);
    input.value = '';
  }
}

function downloadTemplate() {
  window.location.href = '/api/template';
}

function exportCsv() {
  window.location.href = '/api/export';
}

// ========== Transactions ==========
async function openTxnModal() {
  showLoading(true);
  try {
    const data = await api('/api/transactions?limit=100');
    const tbody = document.getElementById('txnBody');
    
    if (data.ok && data.data.length > 0) {
      tbody.innerHTML = data.data.map(t => {
        const typeMap = { in: '入库', out: '出库', init: '初始化', import: '导入' };
        const typeClass = `txn-${t.type}`;
        const deltaClass = t.delta > 0 ? 'txn-delta-pos' : 'txn-delta-neg';
        const deltaPrefix = t.delta > 0 ? '+' : '';
        
        return `
          <tr>
            <td>${new Date(t.created_at).toLocaleString('zh-CN')}</td>
            <td>${t.name || '-'}</td>
            <td>${t.spec || '-'}</td>
            <td><span class="txn-type ${typeClass}">${typeMap[t.type] || t.type}</span></td>
            <td class="num ${deltaClass}">${deltaPrefix}${t.delta}</td>
            <td>${t.operator || '-'}</td>
            <td>${t.remark || '-'}</td>
          </tr>
        `;
      }).join('');
    } else {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px; color: var(--text-muted);">暂无操作记录</td></tr>';
    }
    
    openModal('modalTxn');
  } finally {
    showLoading(false);
  }
}

// ========== Init ==========
async function init() {
  await loadUser();
  await loadData();
}

init();
</script>
